name: HEPE IAM Preview Build

on:
  push:
    branches:
      - feat/hepe-iam-09-user-access
      - feat/hepe-people-01b2h-decision-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Non-production static build and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Start synthetic runtime
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/hepe-iam-next.log 2>&1 &
          echo $! > /tmp/hepe-iam-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hepe-iam-next.log
          exit 1
      - name: Smoke test IAM routes and negative auth paths
        run: |
          set -euo pipefail
          for path in / /login /user-access /user-access/effective-access; do
            code=$(curl -sS -o /tmp/route-body -w '%{http_code}' "http://127.0.0.1:3000${path}")
            test "$code" = "200" || { echo "$path expected 200, got $code"; cat /tmp/route-body; exit 1; }
          done

          code=$(curl -sS -o /tmp/callback-body -w '%{http_code}' http://127.0.0.1:3000/auth/callback)
          test "$code" = "400" || { echo "/auth/callback expected 400 without code, got $code"; cat /tmp/callback-body; exit 1; }
          grep -q 'HEPE_AUTH_CALLBACK_CODE_MISSING' /tmp/callback-body

          code=$(curl -sS -D /tmp/error-headers -o /tmp/error-body -w '%{http_code}' 'http://127.0.0.1:3000/auth/callback?error=access_denied&error_description=synthetic')
          test "$code" = "307" || { echo "controlled auth error expected 307, got $code"; cat /tmp/error-headers; exit 1; }
          grep -qi 'location: .*\/auth\/callback\/status?status=error' /tmp/error-headers
          grep -qi 'reason=access_denied' /tmp/error-headers

          code=$(curl -sS -o /tmp/status-body -w '%{http_code}' 'http://127.0.0.1:3000/auth/callback/status?status=error&reason=access_denied')
          test "$code" = "200" || { echo "/auth/callback/status expected 200, got $code"; cat /tmp/status-body; exit 1; }
      - name: Protected Preview bypass smoke
        if: github.ref_name == 'feat/hepe-people-01b2h-decision-ui'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          HEPE_PREVIEW_URL: https://hepe-ui-prototype-git-feat-hepe-p-685c79-kasemch-3467s-projects.vercel.app
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo 'HEPE_PREVIEW_BYPASS_SECRET_MISSING'
            exit 2
          fi
          code=$(curl -sS -L --max-redirs 0 \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -o /tmp/protected-preview-body \
            -w '%{http_code}' \
            "${HEPE_PREVIEW_URL}/login" || true)
          if [ "$code" != "200" ]; then
            echo "HEPE_PREVIEW_BYPASS_FAILED status=${code}"
            head -c 500 /tmp/protected-preview-body || true
            exit 1
          fi
          grep -qi 'HEPE\|Magic\|login\|เข้าสู่ระบบ' /tmp/protected-preview-body || {
            echo 'HEPE_PREVIEW_LOGIN_CONTENT_NOT_CONFIRMED'
            exit 1
          }
          echo 'HEPE_PREVIEW_BYPASS_PASS'
      - name: Stop synthetic runtime
        if: always()
        run: |
          if [ -f /tmp/hepe-iam-next.pid ]; then
            kill "$(cat /tmp/hepe-iam-next.pid)" 2>/dev/null || true
          fi
