name: HEPE WEB-02AB Controlled Programme Build

on:
  push:
    branches: [feat/hepe-rel-03-runtime-binding]
    paths: ['.github/workflows/hepe-web-02ab-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify WEB-02 boundaries
        run: |
          set -euo pipefail
          grep -q "v_hepe_programme_dashboard_v1" app/programme/page.tsx
          grep -q "DATA_NOT_AVAILABLE" app/programme/page.tsx
          grep -q "NON-PRODUCTION / TEST DATA ONLY" app/programme/page.tsx
          if grep -q "service_role" app/programme/page.tsx lib/hepe/server-supabase.ts; then exit 2; fi
          echo 'WEB02_PROGRAMME_STATIC_BOUNDARY=PASS'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and type-check
        run: npm run build
      - name: Gate boundary
        if: always()
        run: echo 'HEPE-WEB-02AB NON-PRODUCTION read-only verification; no schema/RLS/IAM/Production/merge authorization.'
