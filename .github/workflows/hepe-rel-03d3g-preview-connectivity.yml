name: HEPE REL-03D.3G Exact Preview Connectivity

on:
  pull_request:
    branches: [non-production]
    paths:
      - '.github/workflows/hepe-rel-03d3g-preview-connectivity.yml'

permissions:
  contents: read

jobs:
  connectivity:
    if: ${{ github.event.pull_request.number == 28 && github.event.pull_request.head.ref == 'feat/hepe-rel-03-runtime-binding' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PREVIEW_URL: https://hepe-ui-prototype-ci2pphyal-kasemch-3467s-projects.vercel.app
    steps:
      - name: Diagnose exact Git Preview protection without revealing tokens
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_BYPASS:-}" || exit 78
          code=$(curl --silent --show-error --max-time 20 --output /tmp/runtime.html --dump-header /tmp/headers.txt --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
            --header 'x-vercel-set-bypass-cookie: true' \
            "${PREVIEW_URL}/runtime")
          echo "PREVIEW_HTTP_STATUS=${code}"
          python3 - <<'PY'
          from urllib.parse import urlsplit
          loc=''
          with open('/tmp/headers.txt','r',errors='ignore') as f:
              for line in f:
                  if line.lower().startswith('location:'):
                      loc=line.split(':',1)[1].strip()
                      break
          if loc:
              p=urlsplit(loc)
              print('REDIRECT_HOST='+p.hostname if p.hostname else 'REDIRECT_HOST=RELATIVE')
              print('REDIRECT_PATH='+p.path)
          else:
              print('REDIRECT_HOST=NONE')
          PY
          if [ "$code" = "200" ]; then
            grep -q 'AUTH_REQUIRED' /tmp/runtime.html
            ! grep -q 'RUNTIME_NOT_CONFIGURED' /tmp/runtime.html
            echo 'EXACT_PREVIEW_CONNECTIVITY_PASS'
          else
            echo 'EXACT_PREVIEW_CONNECTIVITY_HOLD'
            exit 1
          fi

      - name: Confirm boundary
        if: always()
        run: echo 'Read-only NON-PRODUCTION connectivity check; no auth mutation, database write, Production action, or PR merge.'
