name: HEPE WEB-02R NOAUTH Diagnostic

on:
  push:
    branches: [feat/hepe-rel-03-runtime-binding]
    paths: ['.github/workflows/hepe-web-02r-noauth-diagnostic.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7bv5GR0-ksXJn91sRHV0Mg_k4nblIGI
      SUPABASE_ADMIN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PREVIEW_URL: https://hepe-ui-prototype-j776c2ghg-kasemch-3467s-projects.vercel.app
      NOAUTH_ACTOR_ID: 9ad6c5a4-ad1e-4985-971d-39770a02dd0c
      NOAUTH_ORIGINAL_SUBJECT: 10000000-0000-0000-0000-000000000006
    steps:
      - uses: actions/checkout@v4
      - run: npm install --ignore-scripts --no-audit --no-fund
      - shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {createClient} from '@supabase/supabase-js';
          import {createServerClient} from '@supabase/ssr';
          const E=process.env;
          const admin=createClient(E.SUPABASE_URL,E.SUPABASE_ADMIN,{auth:{persistSession:false,autoRefreshToken:false}});
          let uid;
          const actor=async()=>{const {data}=await admin.from('actors').select('external_identity_subject').eq('actor_id',E.NOAUTH_ACTOR_ID).single();return data.external_identity_subject};
          try{
            const email=`hepe-noauth-${E.GITHUB_RUN_ID}-${crypto.randomBytes(3).toString('hex')}@example.invalid`;
            const password=crypto.randomBytes(24).toString('base64url');
            const created=await admin.auth.admin.createUser({email,password,email_confirm:true,user_metadata:{hepe_gate:'HEPE-WEB-02R-NOAUTH-DIAG'}});
            if(created.error||!created.data.user)throw new Error('CREATE'); uid=created.data.user.id;
            const reb=await admin.from('actors').update({external_identity_subject:uid}).eq('actor_id',E.NOAUTH_ACTOR_ID);if(reb.error)throw new Error('REBIND');
            const jar=new Map();
            const ssr=createServerClient(E.SUPABASE_URL,E.SUPABASE_PUBLISHABLE_KEY,{cookies:{getAll(){return [...jar].map(([name,value])=>({name,value}))},setAll(xs){for(const x of xs)jar.set(x.name,x.value)}}});
            const signed=await ssr.auth.signInWithPassword({email,password});if(signed.error||!signed.data.session)throw new Error('SIGNIN');
            const direct=await ssr.from('v_hepe_programme_dashboard_v1').select('programme_code');if(direct.error)throw new Error('DIRECT');
            console.log('NOAUTH_DIRECT_ROWS='+(direct.data?.length??0));
            const cookie=[...jar].map(([k,v])=>`${k}=${v}`).join('; ');
            const args=['--silent','--show-error','-H',`x-vercel-protection-bypass: ${E.VERCEL_BYPASS}`,'-H',`Cookie: ${cookie}`,`${E.PREVIEW_URL}/programme`];
            const html=execFileSync('curl',args,{encoding:'utf8'});
            const match=html.match(/<div class="live-state">([^<]+)<\/div>/);
            console.log('NOAUTH_RENDER_STATE='+(match?.[1]?.trim()??'MISSING'));
          }finally{
            await admin.from('actors').update({external_identity_subject:E.NOAUTH_ORIGINAL_SUBJECT}).eq('actor_id',E.NOAUTH_ACTOR_ID);
            if(uid)await admin.auth.admin.deleteUser(uid);
            const {data:users}=await admin.auth.admin.listUsers({page:1,perPage:200});
            const residual=(users?.users??[]).filter(u=>u.user_metadata?.hepe_gate==='HEPE-WEB-02R-NOAUTH-DIAG').length;
            console.log('NOAUTH_CLEANUP='+(await actor()===E.NOAUTH_ORIGINAL_SUBJECT&&residual===0?'PASS':'FAIL'));
          }
          NODE
