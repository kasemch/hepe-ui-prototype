name: HEPE INGEST 02F Authenticated Preview Acceptance

on:
  push:
    branches:
      - feat/hepe-ingest-02e-ui-binding
    paths:
      - '.github/workflows/hepe-ingest-02f-auth.yml'

permissions:
  contents: read

concurrency:
  group: hepe-ingest-02f-auth
  cancel-in-progress: false

jobs:
  authenticated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEPE_GATE: HEPE-INGEST-02F-AUTH
      HEPE_ENVIRONMENT: NON-PRODUCTION
      SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7bv5GR0-ksXJn91sRHV0Mg_k4nblIGI
      SUPABASE_ADMIN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PREVIEW_URL: https://hepe-ui-prototype-h7r0n9q30-kasemch-3467s-projects.vercel.app
      TESTED_APP_SHA: 3daea2f7f3e082dd06ccd55897ddf4db5e1c6d94
    steps:
      - name: Checkout runner head
        uses: actions/checkout@v4

      - name: Verify masked bindings and scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'feat/hepe-ingest-02e-ui-binding' || { echo 'BRANCH_SCOPE_FAIL'; exit 70; }
          test -n "${SUPABASE_ADMIN:-}" || { echo 'SECRET_BINDING_UNAVAILABLE_SUPABASE'; exit 71; }
          test -n "${VERCEL_BYPASS:-}" || { echo 'SECRET_BINDING_UNAVAILABLE_VERCEL'; exit 72; }
          echo 'MASKED_BINDINGS_READY'
          echo "TESTED_APP_SHA=${TESTED_APP_SHA}"
          echo 'NON_PRODUCTION_SCOPE_VERIFIED'

      - name: Protected Preview preflight
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --silent --show-error --max-time 30 --output "$body" --write-out '%{http_code}' \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
            -H 'Cache-Control: no-cache' \
            "${PREVIEW_URL}/curriculum-import")"
          echo "PREFLIGHT_HTTP=${code}"
          test "$code" = '200' || { echo 'PREVIEW_PREFLIGHT_FAIL'; exit 73; }
          grep -q 'NON-PRODUCTION' "$body" || { echo 'NON_PRODUCTION_MARKER_MISSING'; exit 74; }
          grep -q 'AUTH_REQUIRED' "$body" || { echo 'EXPECTED_UNAUTHENTICATED_STATE_MISSING'; exit 75; }
          rm -f "$body"
          echo 'PREVIEW_UNAUTHENTICATED_BOUNDARY_PASS'

      - name: Install controlled dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Execute temporary synthetic Auth acceptance with mandatory rollback
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';

          const E = process.env;
          const fail = (m) => { throw new Error(m); };
          const admin = createClient(E.SUPABASE_URL, E.SUPABASE_ADMIN, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const personaCodes = ['PREPARER_A', 'NO_AUTHORITY', 'REVIEWER_B'];
          const ctx = new Map();
          let failure = null;

          async function loadPersona(code) {
            const { data: fixture, error: fe } = await admin.from('wave6_persona_fixtures').select('persona_code,actor_id,external_identity_subject,expected_programme_code').eq('persona_code', code).single();
            if (fe || !fixture) fail(`PERSONA_LOOKUP_FAILED:${code}`);
            const { data: actor, error: ae } = await admin.from('actors').select('actor_id,external_identity_subject,status').eq('actor_id', fixture.actor_id).single();
            if (ae || !actor) fail(`ACTOR_LOOKUP_FAILED:${code}`);
            const { count, error: ce } = await admin.from('authority_assignments').select('*', { count: 'exact', head: true }).eq('actor_id', actor.actor_id).eq('status', 'ACTIVE');
            if (ce) fail(`AUTHORITY_COUNT_FAILED:${code}`);
            return { fixture, actor, authorityCount: count ?? 0 };
          }
          async function createSynthetic(code) {
            const tag = `${E.GITHUB_RUN_ID}-${crypto.randomBytes(6).toString('hex')}`;
            const email = `hepe-ingest-02f-${code.toLowerCase().replaceAll('_','-')}-${tag}@example.invalid`;
            const password = crypto.randomBytes(32).toString('base64url');
            const { data, error } = await admin.auth.admin.createUser({ email, password, email_confirm: true, user_metadata: { hepe_synthetic_test: true, hepe_gate: 'HEPE-INGEST-02F-AUTH', hepe_persona: code } });
            if (error || !data.user) fail(`AUTH_CREATE_FAILED:${code}`);
            return { uid: data.user.id, email, password };
          }
          async function rebind(actorId, subject) { const { error } = await admin.from('actors').update({ external_identity_subject: subject }).eq('actor_id', actorId); if (error) fail(`ACTOR_REBIND_FAILED:${actorId}`); }
          async function sessionFor(email, password) {
            const jar = new Map();
            const ssr = createServerClient(E.SUPABASE_URL, E.SUPABASE_PUBLISHABLE_KEY, { cookies: { getAll() { return [...jar].map(([name, value]) => ({ name, value })); }, setAll(values) { for (const { name, value } of values) jar.set(name, value); } } });
            const { data, error } = await ssr.auth.signInWithPassword({ email, password });
            if (error || !data.user || !data.session) fail('SESSION_CREATE_FAILED');
            const { data: verified, error: ve } = await ssr.auth.getUser();
            if (ve || verified.user?.id !== data.user.id) fail('SESSION_GETUSER_FAILED');
            const cookie = [...jar].map(([k, v]) => `${k}=${v}`).join('; ');
            if (!cookie) fail('SESSION_COOKIE_MISSING');
            return { token: data.session.access_token, cookie };
          }
          function request(path, cookie) {
            const marker = '__HEPE_HTTP__';
            const out = execFileSync('curl', ['--silent','--show-error','--max-time','30','-H',`x-vercel-protection-bypass: ${E.VERCEL_BYPASS}`,'-H',`cookie: ${cookie}`,'-H','Cache-Control: no-cache','-H','user-agent: HEPE-INGEST-02F-AUTH','-w',`${marker}%{http_code}`,`${E.PREVIEW_URL}${path}`], { encoding: 'utf8', maxBuffer: 5 * 1024 * 1024 });
            const idx = out.lastIndexOf(marker); if (idx < 0) fail(`HTTP_MARKER_MISSING:${path}`);
            return { body: out.slice(0, idx), code: out.slice(idx + marker.length).trim() };
          }
          function userClient(token) { return createClient(E.SUPABASE_URL, E.SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } }); }
          async function assertExistingAuthorityStillWorks(code, token, expectedProgramme) {
            if (code !== 'PREPARER_A') return;
            const uc = userClient(token);
            const { data, error } = await uc.from('v_hepe_review_queue_v1').select('programme_code,review_code');
            if (error) fail(`DIRECT_RLS_POSITIVE_QUERY_FAILED:${error.code ?? 'UNKNOWN'}`);
            if (!data || data.length === 0) fail('DIRECT_RLS_POSITIVE_ROWS_ZERO');
            if (data.some((r) => r.programme_code !== expectedProgramme)) fail('DIRECT_RLS_CROSS_SCOPE_ROW');
            console.log(`DIRECT_RLS_SAME_PROGRAMME_PASS rows=${data.length}`);
          }
          async function assertPreviewBoundary(code, session) {
            const page = request('/curriculum-import', session.cookie);
            console.log(`PAGE_STATUS persona=${code} http=${page.code}`);
            if (page.code !== '200') fail(`PAGE_HTTP_FAIL:${code}:${page.code}`);
            if (page.body.includes('AUTH_REQUIRED')) fail(`AUTH_COOKIE_NOT_RECOGNIZED:${code}`);
            if (!page.body.includes('AUTHORITY_DENIED_OR_READ_MODEL_UNAVAILABLE')) fail(`EXPECTED_SCOPE_DENIAL_MISSING:${code}`);
            const api = request('/api/curriculum-import', session.cookie);
            console.log(`API_STATUS persona=${code} http=${api.code}`);
            if (api.code === '401' || api.body.includes('AUTH_REQUIRED')) fail(`API_AUTH_COOKIE_NOT_RECOGNIZED:${code}`);
            if (api.code !== '403' || !api.body.includes('READ_MODEL_DENIED_OR_UNAVAILABLE')) fail(`API_EXPECTED_RLS_DENIAL_MISSING:${code}`);
            console.log(`AUTHENTICATED_PREVIEW_SCOPE_DENIAL_PASS persona=${code}`);
          }
          try {
            for (const code of personaCodes) { const p = await loadPersona(code); if (p.actor.external_identity_subject !== p.fixture.external_identity_subject) fail(`BASELINE_SUBJECT_MISMATCH:${code}`); ctx.set(code, { ...p, synthetic: null }); }
            if (ctx.get('PREPARER_A').authorityCount !== 1) fail('PREPARER_AUTHORITY_BASELINE_CHANGED');
            if (ctx.get('NO_AUTHORITY').authorityCount !== 0) fail('NOAUTH_AUTHORITY_BASELINE_CHANGED');
            if (ctx.get('REVIEWER_B').authorityCount !== 1) fail('REVIEWER_B_AUTHORITY_BASELINE_CHANGED');
            console.log('PRE_MUTATION_SNAPSHOT_PASS');
            for (const code of personaCodes) { const c = ctx.get(code); c.synthetic = await createSynthetic(code); await rebind(c.actor.actor_id, c.synthetic.uid); }
            console.log('TEMP_SYNTHETIC_USERS_CREATED count=3');
            console.log('TEMP_ACTOR_BINDINGS_APPLIED count=3');
            for (const code of personaCodes) { const c = ctx.get(code); const s = await sessionFor(c.synthetic.email, c.synthetic.password); console.log(`GENUINE_AUTH_SESSION_PASS persona=${code}`); await assertExistingAuthorityStillWorks(code, s.token, c.fixture.expected_programme_code); await assertPreviewBoundary(code, s); }
            console.log('HEPE_INGEST_02F_AUTH_NEGATIVE_ACCEPTANCE_PASS');
          } catch (e) { failure = e; console.error(`HEPE_INGEST_02F_AUTH_ASSERTION_FAIL:${e.message}`); }
          finally {
            const errors = [];
            for (const code of personaCodes) { const c = ctx.get(code); if (!c) continue; try { await rebind(c.actor.actor_id, c.fixture.external_identity_subject); } catch { errors.push(`RESTORE_ACTOR_FAILED:${code}`); } try { if (c.synthetic?.uid) await admin.auth.admin.deleteUser(c.synthetic.uid); } catch { errors.push(`DELETE_AUTH_USER_FAILED:${code}`); } }
            try {
              for (const code of personaCodes) { const p = await loadPersona(code); if (p.actor.external_identity_subject !== p.fixture.external_identity_subject) errors.push(`SUBJECT_NOT_RESTORED:${code}`); const before = ctx.get(code)?.authorityCount; if (before !== undefined && p.authorityCount !== before) errors.push(`AUTHORITY_COUNT_CHANGED:${code}`); }
              const { data, error } = await admin.auth.admin.listUsers({ page: 1, perPage: 1000 }); if (error) errors.push('AUTH_RESIDUAL_QUERY_FAILED'); else if (data.users.some((u) => u.user_metadata?.hepe_gate === 'HEPE-INGEST-02F-AUTH')) errors.push('AUTH_RESIDUAL_PRESENT');
            } catch { errors.push('POST_CLEANUP_VERIFY_FAILED'); }
            if (errors.length) { console.error(`MANDATORY_CLEANUP_FAIL:${errors.join(',')}`); process.exitCode = 2; } else { console.log('ACTOR_BINDINGS_RESTORED_PASS'); console.log('AUTHORITY_ASSIGNMENTS_UNCHANGED_PASS'); console.log('AUTH_CLEANUP_PASS residual=0'); }
          }
          if (failure) process.exitCode = process.exitCode || 1;
          NODE

      - name: Boundary summary
        if: always()
        shell: bash
        run: |
          echo 'Environment: NON-PRODUCTION'
          echo 'Temporary synthetic users only: true'
          echo 'Real user used: false'
          echo 'Email sent: false'
          echo 'SMTP changed: false'
          echo 'Authority grant/revoke: false'
          echo 'IAM policy change: false'
          echo 'Canonical activation/publication: false'
          echo 'Audit Evidence admission: false'
          echo 'Production touched: false'
          echo 'PR merge: false'
