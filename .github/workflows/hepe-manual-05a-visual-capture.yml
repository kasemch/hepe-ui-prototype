name: HEPE-MANUAL-05A Visual Capture

on:
  push:
    branches: [docs/hepe-manual-04-help-tour-blueprint]
    paths:
      - 'scripts/hepe-manual-05a-visual-capture.mjs'
      - '.github/workflows/hepe-manual-05a-visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepe-manual-05a-visual-capture
  cancel-in-progress: false

jobs:
  visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEPE_BASE_URL: https://hepe-ui-prototype-git-docs-hepe-m-8ccb35-kasemch-3467s-projects.vercel.app
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact SHA and boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${VERCEL_BYPASS:-}" || { echo 'VERCEL_BYPASS_BINDING_UNAVAILABLE'; exit 72; }
          ok=0
          for i in $(seq 1 60); do
            body="$(curl --silent --show-error --max-time 20 -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" -H 'Cache-Control: no-cache' "${HEPE_BASE_URL}/api/pilot-build-meta" || true)"
            if printf '%s' "$body" | grep -Fq "\"applicationSha\":\"${GITHUB_SHA}\"" && printf '%s' "$body" | grep -Fq '"environment":"NON-PRODUCTION"' && printf '%s' "$body" | grep -Fq '"production":false'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1 || { echo 'HEPE_MANUAL_05A_EXACT_SHA_PREVIEW_NOT_READY'; exit 73; }
          echo "HEPE_MANUAL_05A_EXACT_SHA_PREVIEW_PASS sha=${GITHUB_SHA}"
      - name: Install controlled browser dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Capture protected Preview and run visual acceptance
        run: node scripts/hepe-manual-05a-visual-capture.mjs
      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hepe-manual-05a-visual-capture-${{ github.sha }}
          path: artifacts/hepe-manual-05a
          if-no-files-found: error
          retention-days: 14
      - name: Boundary summary
        run: |
          echo "APPLICATION_SHA=${GITHUB_SHA}"
          echo 'ENVIRONMENT=NON-PRODUCTION'
          echo 'VERCEL_PROTECTION_BYPASS=AUTOMATION_SECRET_ONLY'
          echo 'HEPE_AUTHENTICATED_SESSION=NOT_USED'
          echo 'IAM_MUTATION=NONE'
          echo 'DATABASE_WRITE=NONE'
          echo 'PRODUCTION_AUTHORIZATION=NOT_GRANTED'
          echo 'PR_MERGE=NOT_ATTEMPTED'
