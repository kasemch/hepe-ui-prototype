name: HEPE WORKFLOW 04 Runner-Based Exact SHA Closure

on:
  push:
    branches: [feat/hepe-academic-workflow-03-exec]
    paths: ['.github/workflows/hepe-workflow-04-runner-closure.yml']

permissions:
  contents: read

concurrency:
  group: hepe-workflow-04-runner-closure
  cancel-in-progress: false

jobs:
  runner-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HEPE_ENVIRONMENT: NON-PRODUCTION
      NEXT_PUBLIC_SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7bv5GR0-ksXJn91sRHV0Mg_k4nblIGI
      SUPABASE_ADMIN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_PROGRAMME_CODE: '25510071103503'
      TARGET_VERSION_CODE: '2567-SOURCEB-VALIDATION'
      TARGET_COURSE_CODE: 'HED2503'
      RUNNER_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checked-out SHA and boundaries
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA" || { echo "EXACT_SHA_MISMATCH actual=$ACTUAL_SHA expected=$GITHUB_SHA"; exit 70; }
          test "${HEPE_ENVIRONMENT}" = "NON-PRODUCTION"
          test -n "${SUPABASE_ADMIN:-}" || { echo 'SUPABASE_ADMIN_BINDING_UNAVAILABLE'; exit 71; }
          echo "RUNNER_EXACT_SHA_CHECKOUT_PASS sha=${GITHUB_SHA}"

      - name: Install dependencies and browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Build exact SHA
        run: npm run build

      - name: Start exact-SHA NON-PRODUCTION runner server
        shell: bash
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_REF: feat/hepe-academic-workflow-03-exec
        run: |
          set -euo pipefail
          nohup npm start > /tmp/hepe-runner.log 2>&1 &
          echo $! > /tmp/hepe-runner.pid
          for i in $(seq 1 60); do
            if curl --silent --fail --max-time 5 "${RUNNER_BASE_URL}/api/pilot-build-meta" > /tmp/build-meta.json; then break; fi
            sleep 2
          done
          test -s /tmp/build-meta.json || { cat /tmp/hepe-runner.log; exit 72; }
          grep -Fq "\"applicationSha\":\"${GITHUB_SHA}\"" /tmp/build-meta.json || { cat /tmp/build-meta.json; exit 73; }
          grep -Fq '"environment":"NON-PRODUCTION"' /tmp/build-meta.json
          grep -Fq '"production":false' /tmp/build-meta.json
          echo "RUNNER_EXACT_SHA_RUNTIME_PASS sha=${GITHUB_SHA}"

      - name: Authenticated synthetic runtime acceptance with mandatory cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';
          const E=process.env;
          const admin=createClient(E.NEXT_PUBLIC_SUPABASE_URL,E.SUPABASE_ADMIN,{auth:{persistSession:false,autoRefreshToken:false}});
          let prep=null,noauth=null,termId=null,offeringId=null,assignmentId=null,tempChairId=null,docId=null,improvementId=null,failure=null;
          const marker=`HEPE-WORKFLOW-04-RUNNER-${E.GITHUB_RUN_ID}`;
          const fail=(m)=>{throw new Error(m)};
          async function persona(code){const {data,error}=await admin.from('wave6_persona_fixtures').select('persona_code,actor_id,external_identity_subject').eq('persona_code',code).single();if(error||!data)fail(`PERSONA_LOOKUP_FAILED:${code}:${error?.code??''}`);return data;}
          async function synthetic(code){const email=`hepe-runner-${code.toLowerCase()}-${E.GITHUB_RUN_ID}-${crypto.randomBytes(4).toString('hex')}@example.invalid`;const password=crypto.randomBytes(32).toString('base64url');const {data,error}=await admin.auth.admin.createUser({email,password,email_confirm:true,user_metadata:{hepe_synthetic_test:true,hepe_gate:'HEPE-WORKFLOW-04-RUNNER',hepe_persona:code}});if(error||!data.user)fail(`AUTH_CREATE_FAILED:${code}`);return {uid:data.user.id,email,password};}
          async function cookieFor(u){const jar=new Map();const ssr=createServerClient(E.NEXT_PUBLIC_SUPABASE_URL,E.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,{cookies:{getAll(){return [...jar].map(([name,value])=>({name,value}))},setAll(v){for(const {name,value} of v)jar.set(name,value)}}});const {data,error}=await ssr.auth.signInWithPassword({email:u.email,password:u.password});if(error||!data.session)fail(`SIGNIN_FAILED:${error?.message??''}`);const cookie=[...jar].map(([k,v])=>`${k}=${v}`).join('; ');if(!cookie)fail('COOKIE_MISSING');return cookie;}
          async function http(path,{cookie='',method='GET',body=null}={}){const headers={'cache-control':'no-cache'};if(cookie)headers.cookie=cookie;if(body!==null)headers['content-type']='application/json';const r=await fetch(E.RUNNER_BASE_URL+path,{method,headers,body:body===null?undefined:JSON.stringify(body)});return {code:r.status,body:await r.text()};}
          try{
            const {data:p,error:pe}=await admin.from('programmes').select('programme_id').eq('programme_code',E.TARGET_PROGRAMME_CODE).single();if(pe||!p)fail('PROGRAMME_NOT_FOUND');
            const {data:v,error:ve}=await admin.from('curriculum_versions').select('curriculum_version_id').eq('programme_id',p.programme_id).eq('version_code',E.TARGET_VERSION_CODE).single();if(ve||!v)fail('VERSION_NOT_FOUND');
            const {data:c,error:ce}=await admin.from('courses').select('course_id').eq('course_code',E.TARGET_COURSE_CODE).single();if(ce||!c)fail('COURSE_NOT_FOUND');
            prep={fixture:await persona('PREPARER_A'),user:await synthetic('PREPARER_A')};noauth={fixture:await persona('NO_AUTHORITY'),user:await synthetic('NO_AUTHORITY')};
            for(const x of [prep,noauth]){const {error}=await admin.from('actors').update({external_identity_subject:x.user.uid}).eq('actor_id',x.fixture.actor_id);if(error)fail(`ACTOR_REBIND_FAILED:${error.code}`);}
            const {data:t,error:te}=await admin.from('academic_terms').insert({academic_year:`SYN-RUNNER-${E.GITHUB_RUN_ID}`,term_code:'SYN',term_label:'Synthetic Runner Closure',status:'DRAFT',source_type:'SYNTHETIC_TEST',source_reference:marker}).select('academic_term_id').single();if(te||!t)fail(`TERM_CREATE_FAILED:${te?.code??''}`);termId=t.academic_term_id;
            const {data:o,error:oe}=await admin.from('course_offerings').insert({programme_id:p.programme_id,curriculum_version_id:v.curriculum_version_id,course_id:c.course_id,academic_term_id:termId,offering_status:'DRAFT',source_status:'SYNTHETIC_TEST',source_reference:marker}).select('course_offering_id').single();if(oe||!o)fail(`OFFERING_CREATE_FAILED:${oe?.code??''}`);offeringId=o.course_offering_id;
            const {data:ia,error:iae}=await admin.from('instructor_assignments').insert({course_offering_id:offeringId,actor_id:prep.fixture.actor_id,assignment_role:'INSTRUCTOR',status:'ACTIVE',source_reference:marker}).select('instructor_assignment_id').single();if(iae||!ia)fail(`ASSIGNMENT_CREATE_FAILED:${iae?.code??''}`);assignmentId=ia.instructor_assignment_id;
            const {data:role,error:re}=await admin.from('roles').select('role_id').eq('role_code','PROGRAMME_CHAIR').single();if(re||!role)fail('CHAIR_ROLE_NOT_FOUND');
            const {data:ta,error:ae}=await admin.from('authority_assignments').insert({actor_id:prep.fixture.actor_id,role_id:role.role_id,authority_level_code:'A4',scope_type:'PROGRAMME',programme_id:p.programme_id,status:'ACTIVE',valid_until:new Date(Date.now()+20*60*1000).toISOString(),assignment_source:'DIRECT'}).select('authority_assignment_id').single();if(ae||!ta)fail(`TEMP_CHAIR_FAILED:${ae?.code??''}`);tempChairId=ta.authority_assignment_id;
            const prepCookie=await cookieFor(prep.user), noCookie=await cookieFor(noauth.user);
            const unauth=await http('/api/workflow-documents');if(unauth.code!==401||!unauth.body.includes('AUTH_REQUIRED'))fail(`DOC_UNAUTH_BOUNDARY_FAIL:${unauth.code}`);
            const d=await http('/api/workflow-documents',{cookie:prepCookie,method:'POST',body:{programme_id:p.programme_id,course_offering_id:offeringId,document_type:'TQF3',title:`Synthetic Runner Document ${E.GITHUB_RUN_ID}`,source_reference:marker}});if(d.code!==201||!d.body.includes('"state":"CREATED"')||!d.body.includes('"status":"DRAFT"'))fail(`DOC_POST_FAIL:${d.code}:${d.body.slice(0,200)}`);docId=JSON.parse(d.body).record.document_record_id;
            const dg=await http('/api/workflow-documents',{cookie:prepCookie});if(dg.code!==200||!dg.body.includes(docId))fail('DOC_GET_AUTH_FAIL');
            const ng=await http('/api/workflow-documents',{cookie:noCookie});if(ng.code!==200||ng.body.includes(docId))fail(`DOC_NOAUTH_BOUNDARY_FAIL:${ng.code}`);
            const imp=await http('/api/workflow-improvements',{cookie:prepCookie,method:'POST',body:{programme_id:p.programme_id,course_offering_id:offeringId,title:'Synthetic Runner Recommendation',category:'ASSESSMENT',description:'Synthetic runtime acceptance only',priority:'MEDIUM',source_reference:marker}});if(imp.code!==201||!imp.body.includes('RECOMMENDATION_CANDIDATE'))fail(`IMPROVEMENT_POST_FAIL:${imp.code}:${imp.body.slice(0,200)}`);improvementId=JSON.parse(imp.body).item.improvement_item_id;
            const ni=await http('/api/workflow-improvements',{cookie:noCookie});if(ni.code!==200||ni.body.includes(improvementId))fail(`IMPROVEMENT_NOAUTH_BOUNDARY_FAIL:${ni.code}`);
            console.log('RUNNER_AUTHENTICATED_RUNTIME_ACCEPTANCE_PASS documents=POST_GET_RLS improvements=POST_RLS noauthority=no_leak');
          }catch(e){failure=e;console.error(`RUNNER_AUTH_RUNTIME_FAIL:${e.message}`)}finally{
            if(improvementId)await admin.from('improvement_items').delete().eq('improvement_item_id',improvementId);
            if(docId)await admin.from('document_records').delete().eq('document_record_id',docId);
            if(tempChairId)await admin.from('authority_assignments').delete().eq('authority_assignment_id',tempChairId);
            if(assignmentId)await admin.from('instructor_assignments').delete().eq('instructor_assignment_id',assignmentId);
            if(offeringId)await admin.from('course_offerings').delete().eq('course_offering_id',offeringId);
            if(termId)await admin.from('academic_terms').delete().eq('academic_term_id',termId);
            for(const x of [prep,noauth])if(x){await admin.from('actors').update({external_identity_subject:x.fixture.external_identity_subject}).eq('actor_id',x.fixture.actor_id);await admin.auth.admin.deleteUser(x.user.uid);}
            const [dr,ir,or,tr]=await Promise.all([
              admin.from('document_records').select('*',{count:'exact',head:true}).eq('source_snapshot_reference',marker),
              admin.from('improvement_items').select('*',{count:'exact',head:true}).eq('source_reference',marker),
              admin.from('course_offerings').select('*',{count:'exact',head:true}).eq('source_reference',marker),
              admin.from('academic_terms').select('*',{count:'exact',head:true}).eq('source_reference',marker)
            ]);
            for(const [name,r] of [['documents',dr],['improvements',ir],['offerings',or],['terms',tr]])if(r.error&&!failure)failure=new Error(`CLEANUP_COUNT_ERROR:${name}:${r.error.code}`);
            const dc=dr.count??0,ic=ir.count??0,oc=or.count??0,tc=tr.count??0;
            if((dc!==0||ic!==0||oc!==0||tc!==0)&&!failure)failure=new Error('CLEANUP_RESIDUAL');
            console.log(`RUNNER_MANDATORY_CLEANUP_VERIFIED documents=${dc} improvements=${ic} offerings=${oc} terms=${tc}`);
          }
          if(failure)throw failure;
          NODE

      - name: Responsive routes and scoped automated accessibility acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          const base=process.env.RUNNER_BASE_URL;
          const routes=[['/','Academic Command Center'],['/pilot','Controlled Pilot Readiness'],['/programme','Programme Overview'],['/curriculum','Curriculum Structure'],['/study-plan','Study Plan'],['/traceability','PLO / Course Traceability'],['/mapping','PLO × Course / I-R-M'],['/evidence','Evidence Explorer'],['/qa','INSUFFICIENT VERIFIED EVIDENCE'],['/reviews','Review Queue'],['/calendar','Academic Tasks'],['/audit','Provenance'],['/ai','AI ADVISORY'],['/governance','Settings / Governance'],['/curriculum-import','AUTH_REQUIRED'],['/tqf3','มคอ.3'],['/tqf5','มคอ.5'],['/verification','ทวนสอบ'],['/tqf7','มคอ.7'],['/course-review','Course Review'],['/approval','Academic Approval Workflow'],['/documents','Document Preview, Print & Export'],['/improvement-hub','ข้อเสนอเพื่อการปรับปรุงหลักสูตร']];
          const viewports=[['desktop',1440,900],['laptop',1024,800],['tablet',768,900],['mobile',390,844]];
          const browser=await chromium.launch({headless:true});const failures=[];
          for(const [vp,w,h] of viewports){const context=await browser.newContext({viewport:{width:w,height:h}});for(const [path,marker] of routes){const page=await context.newPage();const res=await page.goto(base+path,{waitUntil:'networkidle',timeout:45000});const code=res?.status()??0,text=await page.locator('body').innerText();if(code!==200)failures.push(`${vp}:${path}:HTTP_${code}`);if(!text.includes(marker))failures.push(`${vp}:${path}:MARKER_MISSING`);if(!text.includes('NON-PRODUCTION'))failures.push(`${vp}:${path}:NON_PRODUCTION_MISSING`);const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));if(dims.sw>dims.cw+2)failures.push(`${vp}:${path}:HORIZONTAL_OVERFLOW`);if(await page.locator('h1').count()!==1)failures.push(`${vp}:${path}:H1_COUNT`);if(await page.locator('main').count()!==1)failures.push(`${vp}:${path}:MAIN_COUNT`);const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa']).analyze();const serious=axe.violations.filter(v=>['serious','critical'].includes(v.impact||''));if(serious.length)failures.push(`${vp}:${path}:AXE:${serious.map(v=>v.id).join(',')}`);await page.close();}await context.close();}
          await browser.close();if(failures.length){console.error('RUNNER_BROWSER_ACCEPTANCE_FAIL\n'+failures.join('\n'));process.exit(1);}console.log('RUNNER_RESPONSIVE_ACCEPTANCE_PASS viewports=1440,1024,768,390');console.log('SCOPED_AUTOMATED_ACCESSIBILITY_ACCEPTANCE PASS wcag2a,wcag2aa serious_critical=0');console.log('RUNNER_FULL_ROUTE_BROWSER_ACCEPTANCE_PASS routes=23');
          NODE

      - name: Runner-based closure candidate boundary summary
        run: |
          echo "APPLICATION_SHA=${GITHUB_SHA}"
          echo 'ENVIRONMENT=NON-PRODUCTION'
          echo 'RUNNER_EXACT_SHA=PASS'
          echo 'AUTHENTICATED_RUNTIME=PASS'
          echo 'CLEANUP_RESIDUAL=0'
          echo 'RESPONSIVE_BROWSER=PASS'
          echo 'SCOPED_AUTOMATED_ACCESSIBILITY=PASS'
          echo 'VERCEL_PREVIEW_ACCEPTANCE=PENDING_EXTERNAL_QUOTA'
          echo 'PRODUCTION=NOT_TOUCHED'
          echo 'PR_MERGE=NOT_ATTEMPTED'
          echo 'CANONICAL_ACTIVATION=NOT_ATTEMPTED'
          echo 'PUBLICATION=NOT_ATTEMPTED'
          echo 'AUDIT_EVIDENCE_ADMISSION=NOT_ATTEMPTED'

      - name: Stop runner server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/hepe-runner.pid ]; then kill "$(cat /tmp/hepe-runner.pid)" 2>/dev/null || true; fi
