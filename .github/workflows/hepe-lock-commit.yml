name: HEPE Commit Reviewed Lockfile

on:
  push:
    branches:
      - feature/hepe-login-03b-controlled-auth

permissions:
  contents: write
  actions: read

jobs:
  commit-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hepe-login-03b-controlled-auth
      - name: Commit reviewed package-lock artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11300897840"
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already present; no action."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/hepe-lock.zip
          unzip -q /tmp/hepe-lock.zip -d /tmp/hepe-lock
          test -f /tmp/hepe-lock/package-lock.json
          cp /tmp/hepe-lock/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Commit reviewed HEPE package lockfile"
          git push origin HEAD:feature/hepe-login-03b-controlled-auth
