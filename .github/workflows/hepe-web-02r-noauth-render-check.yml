name: HEPE WEB-02R NOAUTH Render Check

on:
  push:
    branches: [feat/hepe-rel-03-runtime-binding]
    paths: ['.github/workflows/hepe-web-02r-noauth-render-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7bv5GR0-ksXJn91sRHV0Mg_k4nblIGI
      SUPABASE_ADMIN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PREVIEW_URL: https://hepe-ui-prototype-j776c2ghg-kasemch-3467s-projects.vercel.app
      NOAUTH_ACTOR_ID: 9ad6c5a4-ad1e-4985-971d-39770a02dd0c
      NOAUTH_ORIGINAL_SUBJECT: 10000000-0000-0000-0000-000000000006
    steps:
      - uses: actions/checkout@v4
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify NO_AUTHORITY rendered live-state and cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';
          const E=process.env;
          const admin=createClient(E.SUPABASE_URL,E.SUPABASE_ADMIN,{auth:{persistSession:false,autoRefreshToken:false}});
          let uid=null;
          const getActor=async()=>{const {data,error}=await admin.from('actors').select('external_identity_subject').eq('actor_id',E.NOAUTH_ACTOR_ID).single();if(error)throw error;return data.external_identity_subject};
          const getAuthority=async()=>{const {count,error}=await admin.from('authority_assignments').select('*',{head:true,count:'exact'}).eq('actor_id',E.NOAUTH_ACTOR_ID).eq('status','ACTIVE');if(error)throw error;return count??0};
          const fetchPage=(path,cookie)=>{const mark='__HTTP__';const args=['--silent','--show-error','--max-time','30','-H',`x-vercel-protection-bypass: ${E.VERCEL_BYPASS}`,'-H',`Cookie: ${cookie}`,'-w',`${mark}%{http_code}`,`${E.PREVIEW_URL}${path}`];const out=execFileSync('curl',args,{encoding:'utf8'});const i=out.lastIndexOf(mark);return {html:out.slice(0,i),code:out.slice(i+mark.length).trim()}};
          const liveState=html=>{const m=html.match(/<div class="live-state">([^<]+)<\/div>/);return m?.[1]?.trim()??'MISSING'};
          try {
            if(await getActor()!==E.NOAUTH_ORIGINAL_SUBJECT) throw new Error('SUBJECT_PRE');
            if(await getAuthority()!==0) throw new Error('AUTHORITY_PRE');
            const email=`hepe-web02r-noauth-${E.GITHUB_RUN_ID}-${crypto.randomBytes(4).toString('hex')}@example.invalid`;
            const password=crypto.randomBytes(32).toString('base64url');
            const {data,error}=await admin.auth.admin.createUser({email,password,email_confirm:true,user_metadata:{hepe_synthetic_test:true,hepe_gate:'HEPE-WEB-02R-NOAUTH'}});
            if(error||!data.user) throw new Error('CREATE_USER');
            uid=data.user.id;
            const {error:rebindError}=await admin.from('actors').update({external_identity_subject:uid}).eq('actor_id',E.NOAUTH_ACTOR_ID);
            if(rebindError) throw new Error('REBIND');
            const jar=new Map();
            const ssr=createServerClient(E.SUPABASE_URL,E.SUPABASE_PUBLISHABLE_KEY,{cookies:{getAll(){return [...jar].map(([name,value])=>({name,value}))},setAll(items){for(const item of items)jar.set(item.name,item.value)}}});
            const {data:sessionData,error:signInError}=await ssr.auth.signInWithPassword({email,password});
            if(signInError||!sessionData.session) throw new Error('SIGNIN');
            const cookie=[...jar].map(([k,v])=>`${k}=${v}`).join('; ');
            for(const path of ['/programme','/curriculum','/traceability','/mapping','/evidence','/qa','/tasks','/ai']){
              const r=fetchPage(path,cookie);
              if(r.code!=='200') throw new Error(`HTTP_${path}_${r.code}`);
              const s=liveState(r.html);
              console.log(`NOAUTH_RENDER ${path} ${s}`);
              if(s!=='EMPTY') throw new Error(`NOAUTH_${path}_STATE_${s}`);
              if(!r.html.includes('NON-PRODUCTION')||!r.html.includes('TEST DATA ONLY')) throw new Error(`BOUNDARY_${path}`);
            }
            console.log('HEPE_WEB02R_NOAUTH_RENDER=PASS');
          } finally {
            await admin.from('actors').update({external_identity_subject:E.NOAUTH_ORIGINAL_SUBJECT}).eq('actor_id',E.NOAUTH_ACTOR_ID);
            if(uid) await admin.auth.admin.deleteUser(uid);
            const subject=await getActor(); const authority=await getAuthority();
            const {data:users}=await admin.auth.admin.listUsers({page:1,perPage:200});
            const residual=(users?.users??[]).filter(u=>u.user_metadata?.hepe_gate==='HEPE-WEB-02R-NOAUTH').length;
            console.log(`NOAUTH_CLEANUP=${subject===E.NOAUTH_ORIGINAL_SUBJECT&&authority===0&&residual===0?'PASS':'FAIL'}`);
            if(subject!==E.NOAUTH_ORIGINAL_SUBJECT||authority!==0||residual!==0) process.exitCode=2;
          }
          NODE
      - run: echo 'NON-PRODUCTION only; no Production or PR merge authorization.'
