name: HEPE PILOT-01 Authenticated E2E

on:
  push:
    branches: [feat/hepe-pilot-master-01]
    paths: ['.github/workflows/hepe-pilot-01e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7bv5GR0-ksXJn91sRHV0Mg_k4nblIGI
      SUPABASE_ADMIN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PREVIEW_URL: https://hepe-ui-prototype-qbkh614cw-kasemch-3467s-projects.vercel.app
      APP_SHA_UNDER_TEST: d4ffeace81d7aed46ba672d1f935cbbe996a82bc
      PREPARER_ACTOR_ID: dd73e0bc-c07d-4df7-8a50-c2103f0a9c6d
      NOAUTH_ACTOR_ID: 9ad6c5a4-ad1e-4985-971d-39770a02dd0c
      PREPARER_ORIGINAL_SUBJECT: 10000000-0000-0000-0000-000000000001
      NOAUTH_ORIGINAL_SUBJECT: 10000000-0000-0000-0000-000000000006
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build and boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f app/teaching/page.tsx
          test -f app/assessment/page.tsx
          test -f app/plan-actual/page.tsx
          grep -q 'NO EVIDENCE' app/plan-actual/page.tsx
          grep -q 'Human academic authority preserved' app/assessment/page.tsx
          ! grep -R --line-number --include='*.ts' --include='*.tsx' 'service_role\|SERVICE_ROLE' app lib

      - name: Authenticated pilot critical-path regression and mandatory cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {createClient} from '@supabase/supabase-js';
          import {createServerClient} from '@supabase/ssr';

          const E=process.env;
          const required=['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_ADMIN','VERCEL_BYPASS','PREVIEW_URL','APP_SHA_UNDER_TEST'];
          for(const k of required) if(!E[k]) throw new Error(`MISSING_REQUIRED_BINDING_${k}`);

          const admin=createClient(E.SUPABASE_URL,E.SUPABASE_ADMIN,{auth:{persistSession:false,autoRefreshToken:false}});
          const personas=[
            {name:'PREPARER_A',actorId:E.PREPARER_ACTOR_ID,original:E.PREPARER_ORIGINAL_SUBJECT,authority:1},
            {name:'NO_AUTHORITY',actorId:E.NOAUTH_ACTOR_ID,original:E.NOAUTH_ORIGINAL_SUBJECT,authority:0}
          ];
          const users=[];
          const fail=m=>{throw new Error(m)};
          const actor=async id=>{const {data,error}=await admin.from('actors').select('external_identity_subject').eq('actor_id',id).single();if(error)fail('ACTOR_READ');return data.external_identity_subject};
          const authority=async id=>{const {count,error}=await admin.from('authority_assignments').select('*',{head:true,count:'exact'}).eq('actor_id',id).eq('status','ACTIVE');if(error)fail('AUTHORITY_READ');return count??0};
          const fetchPage=(path,cookie='')=>{
            const mark='__HTTP__';
            const args=['--silent','--show-error','--max-time','30','-H',`x-vercel-protection-bypass: ${E.VERCEL_BYPASS}`];
            if(cookie) args.push('-H',`Cookie: ${cookie}`);
            args.push('-w',`${mark}%{http_code}`,`${E.PREVIEW_URL}${path}`);
            const out=execFileSync('curl',args,{encoding:'utf8',maxBuffer:15*1024*1024});
            const i=out.lastIndexOf(mark);
            return {html:out.slice(0,i),code:out.slice(i+mark.length).trim()};
          };
          const liveState=html=>html.match(/<div class="live-state">([^<]+)<\/div>/)?.[1]?.trim()??'MISSING';

          try {
            console.log(`PILOT_APP_SHA_UNDER_TEST=${E.APP_SHA_UNDER_TEST}`);

            for(const path of ['/teaching','/assessment','/plan-actual']){
              const r=fetchPage(path);
              if(r.code!=='200') fail(`UNAUTH_${path}_HTTP_${r.code}`);
              if(liveState(r.html)!=='AUTH_REQUIRED') fail(`UNAUTH_${path}_${liveState(r.html)}`);
              if(!r.html.includes('NON-PRODUCTION')) fail(`UNAUTH_${path}_BOUNDARY`);
              console.log(`UNAUTH ${path}=AUTH_REQUIRED`);
            }

            for(const p of personas){
              if(await actor(p.actorId)!==p.original) fail(`${p.name}_SUBJECT_PRE`);
              if(await authority(p.actorId)!==p.authority) fail(`${p.name}_AUTHORITY_PRE`);
            }

            for(const p of personas){
              const email=`hepe-pilot01-${E.GITHUB_RUN_ID}-${p.name}-${crypto.randomBytes(4).toString('hex')}@example.invalid`;
              const password=crypto.randomBytes(32).toString('base64url');
              const created=await admin.auth.admin.createUser({email,password,email_confirm:true,user_metadata:{hepe_synthetic_test:true,hepe_gate:'HEPE-PILOT-01E2E',hepe_persona:p.name}});
              if(created.error||!created.data.user) fail(`${p.name}_CREATE`);
              p.uid=created.data.user.id;p.email=email;p.password=password;users.push(p.uid);
              const rb=await admin.from('actors').update({external_identity_subject:p.uid}).eq('actor_id',p.actorId);
              if(rb.error) fail(`${p.name}_REBIND`);
            }

            for(const p of personas){
              const jar=new Map();
              const ssr=createServerClient(E.SUPABASE_URL,E.SUPABASE_PUBLISHABLE_KEY,{cookies:{getAll(){return [...jar].map(([name,value])=>({name,value}))},setAll(xs){for(const x of xs)jar.set(x.name,x.value)}}});
              const sign=await ssr.auth.signInWithPassword({email:p.email,password:p.password});
              if(sign.error||!sign.data.session) fail(`${p.name}_SIGNIN`);
              const cookie=[...jar].map(([k,v])=>`${k}=${v}`).join('; ');

              for(const path of ['/teaching','/assessment','/plan-actual']){
                const r=fetchPage(path,cookie);
                if(r.code!=='200') fail(`${p.name}_${path}_HTTP_${r.code}`);
                const s=liveState(r.html);
                console.log(`${p.name}_RENDER ${path} ${s}`);
                if(!r.html.includes('NON-PRODUCTION')||!r.html.includes('TEST DATA ONLY')) fail(`${p.name}_${path}_BOUNDARY`);
                if(p.name==='NO_AUTHORITY'&&s!=='EMPTY') fail(`${p.name}_${path}_${s}`);
                if(p.name==='PREPARER_A'&&s!=='VERIFIED') fail(`${p.name}_${path}_${s}`);
                if(p.name==='PREPARER_A'&&path==='/teaching'&&!r.html.includes('SYN-LA01')) fail('TEACHING_FIXTURE_NOT_VISIBLE');
                if(p.name==='PREPARER_A'&&path==='/assessment'&&!r.html.includes('SYN-AS01')) fail('ASSESSMENT_FIXTURE_NOT_VISIBLE');
                if(p.name==='PREPARER_A'&&path==='/plan-actual'){
                  if(!r.html.includes('SYN-LA01')||!r.html.includes('SYN-LA02')) fail('PLAN_ACTUAL_FIXTURE_NOT_VISIBLE');
                  if(!r.html.includes('NO EVIDENCE')) fail('PLAN_ACTUAL_MISSING_EVIDENCE_NOT_EXPLICIT');
                  if(!r.html.includes('PARTIALLY ALIGNED')) fail('PLAN_ACTUAL_CONSERVATIVE_CLASSIFICATION_MISSING');
                }
              }
            }

            console.log('HEPE_PILOT01_AUTHENTICATED_E2E=PASS');
          } finally {
            for(const p of personas){
              const restored=await admin.from('actors').update({external_identity_subject:p.original}).eq('actor_id',p.actorId);
              if(restored.error) console.error(`${p.name}_RESTORE_FAILED`);
            }
            for(const uid of users){
              const d=await admin.auth.admin.deleteUser(uid);
              if(d.error) console.error('SYNTHETIC_USER_DELETE_FAILED');
            }
            let ok=true;
            for(const p of personas){
              if(await actor(p.actorId)!==p.original||await authority(p.actorId)!==p.authority) ok=false;
            }
            const {data:post}=await admin.auth.admin.listUsers({page:1,perPage:200});
            const authResidual=(post?.users??[]).filter(u=>u.user_metadata?.hepe_gate==='HEPE-PILOT-01E2E').length;
            console.log(`PILOT01_AUTH_RESIDUAL=${authResidual}`);
            console.log(`PILOT01_IDENTITY_RESTORE=${ok?'PASS':'FAIL'}`);
            console.log(`PILOT01_CLEANUP=${ok&&authResidual===0?'PASS':'FAIL'}`);
            if(!ok||authResidual!==0) process.exitCode=2;
          }
          NODE

      - name: Boundary summary
        run: |
          echo 'HEPE-PILOT-01E2E=NON-PRODUCTION ONLY'
          echo 'REAL_DATA_WRITE=NONE'
          echo 'REAL_USER_AUTHORITY_CHANGE=NONE'
          echo 'PRODUCTION_AUTHORIZATION=NOT_GRANTED'
          echo 'PR_MERGE_AUTHORIZATION=NOT_GRANTED'
