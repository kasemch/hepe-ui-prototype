name: HEPE REL-03D.3G.3 Authenticated Persona E2E

on:
  push:
    branches: [feat/hepe-rel-03-runtime-binding]
    paths: ['.github/workflows/hepe-rel-03d3g3-auth-e2e.yml']

permissions:
  contents: read

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7bv5GR0-ksXJn91sRHV0Mg_k4nblIGI
      SUPABASE_ADMIN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PREVIEW_URL: https://hepe-ui-prototype-hik8bpx6x-kasemch-3467s-projects.vercel.app
      PREPARER_ACTOR_ID: dd73e0bc-c07d-4df7-8a50-c2103f0a9c6d
      NOAUTH_ACTOR_ID: 9ad6c5a4-ad1e-4985-971d-39770a02dd0c
      PREPARER_ORIGINAL_SUBJECT: 10000000-0000-0000-0000-000000000001
      NOAUTH_ORIGINAL_SUBJECT: 10000000-0000-0000-0000-000000000006
    steps:
      - uses: actions/checkout@v4
      - name: Verify masked bindings
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ADMIN:-}" || exit 78
          test -n "${VERCEL_BYPASS:-}" || exit 78
      - name: Install controlled dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Execute authenticated E2E with mandatory rollback
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';

          const E=process.env;
          const admin=createClient(E.SUPABASE_URL,E.SUPABASE_ADMIN,{auth:{persistSession:false,autoRefreshToken:false}});
          const personas=[
            {name:'PREPARER_A',actorId:E.PREPARER_ACTOR_ID,original:E.PREPARER_ORIGINAL_SUBJECT,expectedAuthority:1},
            {name:'NO_AUTHORITY',actorId:E.NOAUTH_ACTOR_ID,original:E.NOAUTH_ORIGINAL_SUBJECT,expectedAuthority:0},
          ];
          const created=[];

          const fail=(m)=>{throw new Error(m)};
          async function actor(actorId){const {data,error}=await admin.from('actors').select('actor_id,external_identity_subject').eq('actor_id',actorId).single(); if(error) fail('ACTOR_READ_FAILED'); return data;}
          async function authorityCount(actorId){const {count,error}=await admin.from('authority_assignment').select('*',{count:'exact',head:true}).eq('actor_id',actorId); if(error) fail('AUTHORITY_COUNT_FAILED'); return count??0;}
          function page(path,cookieHeader){const marker='__HEPE_HTTP__'; const out=execFileSync('curl',['--silent','--show-error','--max-time','30','-H',`x-vercel-protection-bypass: ${E.VERCEL_BYPASS}`,'-H',`Cookie: ${cookieHeader}`,'-w',`${marker}%{http_code}`,`${E.PREVIEW_URL}${path}`],{encoding:'utf8',maxBuffer:8*1024*1024}); const i=out.lastIndexOf(marker); if(i<0) fail('HTTP_MARKER_MISSING'); return {html:out.slice(0,i),code:out.slice(i+marker.length).trim()};}
          function state(html){for(const s of ['RUNTIME_NOT_CONFIGURED','AUTH_REQUIRED','QUERY_ERROR','VERIFIED','EMPTY']) if(html.includes(`>${s}<`)||html.includes(s)) return s; return 'UNKNOWN';}

          try {
            for(const p of personas){const a=await actor(p.actorId); if(a.external_identity_subject!==p.original) fail(`${p.name}_PRE_SUBJECT_MISMATCH`); const ac=await authorityCount(p.actorId); if(ac!==p.expectedAuthority) fail(`${p.name}_PRE_AUTHORITY_MISMATCH`);}
            const {data:preUsers}=await admin.auth.admin.listUsers({page:1,perPage:100});
            const preResidual=(preUsers?.users??[]).filter(u=>u.user_metadata?.hepe_gate==='HEPE-REL-03D.3G.3').length;
            if(preResidual!==0) fail('PRE_AUTH_RESIDUAL_NONZERO');
            console.log('PRECONDITION=PASS');

            for(const p of personas){
              const tag=`${process.env.GITHUB_RUN_ID}-${p.name}-${crypto.randomBytes(4).toString('hex')}`;
              const email=`hepe-rel03-${tag}@example.invalid`;
              const password=crypto.randomBytes(32).toString('base64url');
              const {data:cu,error:ce}=await admin.auth.admin.createUser({email,password,email_confirm:true,user_metadata:{hepe_synthetic_test:true,hepe_gate:'HEPE-REL-03D.3G.3',hepe_persona:p.name}});
              if(ce||!cu.user) fail(`${p.name}_CREATE_FAILED`);
              p.uid=cu.user.id; p.email=email; p.password=password; created.push(cu.user.id);
              const {error:ue}=await admin.from('actors').update({external_identity_subject:p.uid}).eq('actor_id',p.actorId); if(ue) fail(`${p.name}_REBIND_FAILED`);
              console.log(`${p.name}_AUTH_USER_CREATED=PASS`);
            }

            for(const p of personas){
              const jar=new Map();
              const ssr=createServerClient(E.SUPABASE_URL,E.SUPABASE_PUBLISHABLE_KEY,{cookies:{getAll(){return [...jar].map(([name,value])=>({name,value}));},setAll(xs){for(const x of xs)jar.set(x.name,x.value);}}});
              const {data:si,error:se}=await ssr.auth.signInWithPassword({email:p.email,password:p.password}); if(se||!si.session) fail(`${p.name}_SIGNIN_FAILED`);
              const {data:gu,error:ge}=await ssr.auth.getUser(); if(ge||gu.user?.id!==p.uid) fail(`${p.name}_LOCAL_GETUSER_FAILED`);
              const token=si.session.access_token;
              const userClient=createClient(E.SUPABASE_URL,E.SUPABASE_PUBLISHABLE_KEY,{global:{headers:{Authorization:`Bearer ${token}`}},auth:{persistSession:false,autoRefreshToken:false}});
              const cookieHeader=[...jar].map(([k,v])=>`${k}=${v}`).join('; ');
              if(!cookieHeader) fail(`${p.name}_COOKIE_MISSING`);

              const modules=[
                ['reviews','v_hepe_review_queue_v1'],
                ['evidence','v_hepe_evidence_projection_v1'],
                ['outbox','connector_outbox'],
                ['reconciliation','reconciliation_item'],
                ['runtime','connector_health_snapshot'],
              ];
              for(const [mod,table] of modules){
                const {data,error}=await userClient.from(table).select('*').limit(50); if(error) fail(`${p.name}_${mod}_DIRECT_QUERY_FAILED`);
                const rows=data??[];
                const r=page('/'+mod,cookieHeader); if(r.code!=='200') fail(`${p.name}_${mod}_HTTP_${r.code}`);
                const st=state(r.html);
                if(['AUTH_REQUIRED','RUNTIME_NOT_CONFIGURED','QUERY_ERROR','UNKNOWN'].includes(st)) fail(`${p.name}_${mod}_STATE_${st}`);
                if(rows.length===0 && st!=='EMPTY') fail(`${p.name}_${mod}_EXPECTED_EMPTY_GOT_${st}`);
                if(rows.length>0 && st!=='VERIFIED') fail(`${p.name}_${mod}_EXPECTED_VERIFIED_GOT_${st}`);
                if(p.name==='NO_AUTHORITY' && rows.length!==0) fail(`${p.name}_${mod}_VISIBLE_ROWS_${rows.length}`);
                if(p.name==='PREPARER_A' && mod==='reviews'){
                  if(rows.length===0) fail('PREPARER_REVIEWS_EMPTY_UNEXPECTED');
                  if(rows.some(x=>x.programme_code!=='SYN-HEPE-A')) fail('PREPARER_REVIEWS_CROSS_PROGRAMME');
                }
                console.log(`${p.name}_${mod.toUpperCase()}=PASS rows=${rows.length} state=${st}`);
              }
            }
            console.log('AUTHENTICATED_E2E=PASS');
          } finally {
            for(const p of personas){
              await admin.from('actors').update({external_identity_subject:p.original}).eq('actor_id',p.actorId);
            }
            for(const uid of created){ await admin.auth.admin.deleteUser(uid); }
            let cleanupOk=true;
            for(const p of personas){const a=await actor(p.actorId); const ac=await authorityCount(p.actorId); console.log(`${p.name}_RESTORED_SUBJECT=${a.external_identity_subject===p.original?'PASS':'FAIL'}`); console.log(`${p.name}_AUTHORITY_COUNT=${ac}`); if(a.external_identity_subject!==p.original||ac!==p.expectedAuthority) cleanupOk=false;}
            const {data:postUsers}=await admin.auth.admin.listUsers({page:1,perPage:100});
            const residual=(postUsers?.users??[]).filter(u=>u.user_metadata?.hepe_gate==='HEPE-REL-03D.3G.3').length;
            console.log('AUTH_RESIDUAL='+residual);
            console.log('MANDATORY_CLEANUP='+(cleanupOk&&residual===0?'PASS':'FAIL'));
            if(!cleanupOk||residual!==0) process.exitCode=2;
          }
          NODE
      - name: Confirm environment boundary
        if: always()
        run: echo 'NON-PRODUCTION synthetic E2E only; no schema/RLS/Production mutation; mandatory rollback executed.'
