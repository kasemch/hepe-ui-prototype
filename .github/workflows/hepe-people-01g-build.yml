name: HEPE PEOPLE Feature Build Verification

on:
  push:
    branches:
      - 'feat/hepe-people-*'
  pull_request:
    branches:
      - feat/hepe-people-01b2h-decision-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Next.js application
        run: npm run build
