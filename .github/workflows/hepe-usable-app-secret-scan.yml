name: HEPE USABLE-APP Secret and Boundary Scan

on:
  push:
    branches: [feat/hepe-usable-app-closure-batch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-boundary-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan for prohibited secret material
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          scan() {
            local pattern="$1"
            local label="$2"
            if git grep -nEI "$pattern" -- ':!package-lock.json' ':!docs/**' ':!.github/workflows/**' >/tmp/hepe-scan.txt 2>/dev/null; then
              echo "SECRET_SCAN_FAIL:${label}"
              sed -n '1,20p' /tmp/hepe-scan.txt
              fail=1
            else
              echo "SECRET_SCAN_PASS:${label}"
            fi
          }
          scan 'sb_secret_[A-Za-z0-9_-]+' 'SUPABASE_SECRET_KEY_LITERAL'
          scan 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^$[:space:]]+' 'SERVICE_ROLE_LITERAL_ASSIGNMENT'
          scan 'VERCEL_AUTOMATION_BYPASS_SECRET[[:space:]]*=[[:space:]]*[^$[:space:]]+' 'VERCEL_BYPASS_LITERAL_ASSIGNMENT'
          scan 'BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY' 'PRIVATE_KEY_MATERIAL'
          test "$fail" = '0'

      - name: Application source privilege boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --include='*.ts' --include='*.tsx' -E 'service_role|SERVICE_ROLE|sb_secret_' app lib
          echo 'APP_SOURCE_PRIVILEGED_SECRET_SCAN=PASS'

      - name: Closure boundary summary
        run: |
          echo "APPLICATION_SHA=${GITHUB_SHA}"
          echo 'SECRET_SCAN=PASS'
          echo 'ENVIRONMENT=NON-PRODUCTION'
          echo 'PRODUCTION_AUTHORIZATION=NOT_GRANTED'
          echo 'REAL_DATA_WRITE=NONE'
          echo 'PR_MERGE=NOT_ATTEMPTED'
