name: HEPE Course Registry Exact Vercel Preview Acceptance

on:
  push:
    branches: [feat/hepe-course-registry-01]
    paths:
      - '.github/workflows/hepe-course-registry-01-vercel-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepe-course-registry-vercel-acceptance
  cancel-in-progress: false

jobs:
  authenticated-vercel-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEPE_BASE_URL: https://hepe-ui-prototype-nxe6qs7wi-kasemch-3467s-projects.vercel.app
      EXPECTED_APP_SHA: 40e752f111f60becc506271c531eadbb4ee3c8f6
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7bv5GR0-ksXJn91sRHV0Mg_k4nblIGI
      SUPABASE_ADMIN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYSTEM_ADMIN_ACTOR_ID: 58b77439-0efe-4569-9d11-69823bee3ba9
      SYSTEM_ADMIN_ORIGINAL_SUBJECT: 10000000-0000-0000-0000-000000000010
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact preview binding and non-production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_BYPASS:-}" || { echo 'VERCEL_BYPASS_BINDING_UNAVAILABLE'; exit 72; }
          test -n "${SUPABASE_ADMIN:-}" || { echo 'SUPABASE_ADMIN_BINDING_UNAVAILABLE'; exit 71; }
          echo "RUNNER_SHA=${GITHUB_SHA}"
          echo "APPLICATION_SHA=${EXPECTED_APP_SHA}"
          echo 'RUNTIME=VERCEL_EXACT_PREVIEW_NON_PRODUCTION'
      - name: Install controlled browser dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Execute authenticated course registry acceptance with mandatory cleanup
        run: node scripts/hepe-people-01k-authenticated-visual-acceptance.mjs
      - name: Upload exact preview acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepe-course-registry-vercel-${{ github.sha }}
          path: artifacts/hepe-global-app-integration-01
          if-no-files-found: error
          retention-days: 14
      - name: Boundary summary
        if: always()
        run: |
          echo "APPLICATION_SHA=${EXPECTED_APP_SHA}"
          echo 'RUNTIME=VERCEL_EXACT_PREVIEW_NON_PRODUCTION'
          echo 'SYNTHETIC_USER=TEMPORARY'
          echo 'IDENTITY_REBIND=TEMPORARY_AND_RESTORED_BY_RUNNER'
          echo 'AUTHORITY_ASSIGNMENT_CHANGE=NONE'
          echo 'RLS_CHANGE=NONE'
          echo 'CURRICULUM_ACTIVATION=NONE'
          echo 'COURSE_RECORD_WRITE=NONE'
          echo 'AUDIT_EVIDENCE_ADMISSION=NONE'
          echo 'PRODUCTION_AUTHORIZATION=NOT_GRANTED'
