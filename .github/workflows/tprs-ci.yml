name: HEPE-TPRS CI
on:
  pull_request:
    paths:
      - 'app/tprs/**'
      - 'scripts/tprs-**'
      - 'supabase/migrations/**'
      - '.github/workflows/tprs-ci.yml'
      - 'package.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deterministic compliance acceptance
        run: node scripts/tprs-compliance-test.mjs
      - name: Backend migration static acceptance
        run: node scripts/tprs-backend-static-test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
