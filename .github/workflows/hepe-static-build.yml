name: HEPE Static Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7bv5GR0-ksXJn91sRHV0Mg_k4nblIGI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: hepe-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Dependency inventory
        run: npm list --depth=0
      - name: Dependency security audit
        run: npm audit --omit=dev || true
      - run: npm run build
