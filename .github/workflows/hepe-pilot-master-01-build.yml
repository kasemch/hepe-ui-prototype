name: HEPE PILOT-MASTER-01 Build Regression

on:
  push:
    branches:
      - feat/hepe-pilot-master-01
      - feat/hepe-usable-app-closure-batch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Next.js build and type validity
        run: npm run build

      - name: Pilot critical-path source assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f app/teaching/page.tsx
          test -f app/assessment/page.tsx
          test -f app/plan-actual/page.tsx
          test -f app/my-courses/page.tsx
          test -f 'app/course-workspace/[id]/page.tsx'
          test -f app/pilot-entry/page.tsx
          test -f app/pilot-entry/PilotEntryClient.tsx
          test -f app/globals.css
          grep -q 'NON-PRODUCTION' app/teaching/page.tsx
          grep -q 'NO EVIDENCE' app/plan-actual/page.tsx
          grep -q 'Human academic authority preserved' app/assessment/page.tsx
          grep -q 'course-workspace' app/my-courses/page.tsx
          grep -q 'Selected course context is preserved' app/pilot-entry/page.tsx
          grep -q '60-SECOND ENTRY · TEACHING' app/pilot-entry/PilotEntryClient.tsx
          grep -q '@media(max-width:760px)' app/globals.css
          grep -q '@media(max-width:420px)' app/globals.css
          grep -q ':focus-visible' app/globals.css
          grep -q 'grid-template-columns:1fr' app/globals.css
          ! grep -R --line-number --include='*.ts' --include='*.tsx' 'service_role\|SERVICE_ROLE' app lib

      - name: Boundary summary
        run: |
          echo 'ENVIRONMENT=NON-PRODUCTION'
          echo 'PRODUCTION_AUTHORIZATION=NOT_GRANTED'
          echo 'SCHEMA_RLS_CHANGE=NONE'
          echo 'REAL_DATA_WRITE=NONE'
          echo 'RESPONSIVE_STATIC_ASSERTIONS=ENFORCED'
          echo 'KEYBOARD_FOCUS_ASSERTION=ENFORCED'
