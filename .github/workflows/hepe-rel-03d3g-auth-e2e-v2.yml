name: HEPE REL-03D.3G Authenticated Preview E2E v2

on:
  pull_request:
    branches: [non-production]
    paths:
      - '.github/workflows/hepe-rel-03d3g-auth-e2e-v2.yml'

permissions:
  contents: read

jobs:
  authenticated-preview-e2e:
    if: ${{ github.event.pull_request.number == 28 && github.event.pull_request.head.ref == 'feat/hepe-rel-03-runtime-binding' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://lztxpjsuzqvtgyasfnyj.supabase.co
      SUPABASE_ADMIN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PREVIEW_URL: https://hepe-ui-prototype-git-feat-hepe-r-1d9444-kasemch-3467s-projects.vercel.app
      PREPARER_ORIGINAL: 10000000-0000-0000-0000-000000000001
      NOAUTH_ORIGINAL: 10000000-0000-0000-0000-000000000006
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify masked bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ADMIN:-}" || { echo 'SECRET_BINDING_UNAVAILABLE_SUPABASE'; exit 78; }
          test -n "${VERCEL_BYPASS:-}" || { echo 'SECRET_BINDING_UNAVAILABLE_VERCEL'; exit 78; }
          echo 'MASKED_BINDINGS_READY'

      - name: Install controlled dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Execute authenticated synthetic Preview acceptance with mandatory cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';

          const E = process.env;
          const fail = (m) => { throw new Error(m); };
          const admin = createClient(E.SUPABASE_URL, E.SUPABASE_ADMIN, { auth: { persistSession:false, autoRefreshToken:false } });
          let prepActor=null, noActor=null, prepUid=null, noUid=null, prepProgramme=null, failure=null;

          async function persona(code) {
            const {data:f,error:fe}=await admin.from('wave6_persona_fixtures').select('actor_id,external_identity_subject,expected_programme_code').eq('persona_code',code).single();
            if(fe||!f) fail(`PERSONA_LOOKUP_FAILED:${code}`);
            const {data:a,error:ae}=await admin.from('actors').select('actor_id,external_identity_subject,status').eq('actor_id',f.actor_id).single();
            if(ae||!a) fail(`ACTOR_LOOKUP_FAILED:${code}`);
            return {f,a};
          }
          async function authCount(actorId){
            const {count,error}=await admin.from('authority_assignments').select('*',{count:'exact',head:true}).eq('actor_id',actorId);
            if(error) fail('AUTHORITY_COUNT_QUERY_FAILED'); return count??0;
          }
          async function createUser(label){
            const tag=`${E.GITHUB_RUN_ID}-${crypto.randomBytes(5).toString('hex')}`;
            const email=`hepe-rel03-${label.toLowerCase()}-${tag}@example.invalid`;
            const password=crypto.randomBytes(32).toString('base64url');
            const {data,error}=await admin.auth.admin.createUser({email,password,email_confirm:true,user_metadata:{hepe_synthetic_test:true,hepe_gate:'HEPE-REL-03D.3G',hepe_persona:label}});
            if(error||!data.user) fail(`AUTH_CREATE_FAILED:${label}`);
            return {uid:data.user.id,email,password};
          }
          async function rebind(actorId,subject){
            const {error}=await admin.from('actors').update({external_identity_subject:subject}).eq('actor_id',actorId);
            if(error) fail('ACTOR_REBIND_FAILED');
          }
          async function session(email,password){
            const jar=new Map();
            const c=createServerClient(E.SUPABASE_URL,E.SUPABASE_ADMIN,{cookies:{getAll(){return [...jar].map(([name,value])=>({name,value}));},setAll(xs){for(const x of xs) jar.set(x.name,x.value);}}});
            const {data,error}=await c.auth.signInWithPassword({email,password});
            if(error||!data.user||!data.session) fail('SESSION_CREATE_FAILED');
            const {data:u,error:ue}=await c.auth.getUser();
            if(ue||!u.user||u.user.id!==data.user.id) fail('AUTH_GETUSER_VALIDATION_FAILED');
            const cookie=[...jar].map(([k,v])=>`${k}=${v}`).join('; ');
            if(!cookie) fail('SESSION_COOKIE_MISSING');
            return {uid:data.user.id,cookie};
          }
          async function page(path,cookie){
            const res=await fetch(`${E.PREVIEW_URL}${path}`,{redirect:'follow',headers:{'x-vercel-protection-bypass':E.VERCEL_BYPASS,'cookie':cookie,'user-agent':'HEPE-REL-03D.3G-SYNTHETIC-E2E'}});
            const text=await res.text();
            if(!res.ok) fail(`PREVIEW_HTTP_${res.status}:${path}`);
            if(text.includes('RUNTIME_NOT_CONFIGURED')) fail(`RUNTIME_NOT_CONFIGURED:${path}`);
            if(text.includes('AUTH_REQUIRED')) fail(`AUTH_REQUIRED:${path}`);
            if(text.includes('QUERY_ERROR')) fail(`QUERY_ERROR:${path}`);
            return text;
          }
          async function expectedReviews(){
            const {data:allowed,error:aerr}=await admin.from('v_hepe_review_queue_v1').select('programme_code,review_code').eq('programme_code',prepProgramme);
            if(aerr||!allowed||allowed.length===0) fail('EXPECTED_REVIEW_SCOPE_FAILED');
            const {data:forbidden,error:ferr}=await admin.from('v_hepe_review_queue_v1').select('programme_code,review_code').neq('programme_code',prepProgramme);
            if(ferr) fail('FORBIDDEN_REVIEW_SCOPE_FAILED');
            return {allowed,forbidden:forbidden??[]};
          }
          async function assertPrep(s){
            const scope=await expectedReviews();
            const html={}; for(const p of ['/reviews','/evidence','/outbox','/reconciliation','/runtime']) html[p]=await page(p,s.cookie);
            if(!html['/reviews'].includes('VERIFIED')) fail('PREPARER_REVIEWS_NOT_VERIFIED');
            for(const r of scope.allowed) if(!html['/reviews'].includes(String(r.review_code))) fail('PREPARER_ALLOWED_ROW_MISSING');
            for(const r of scope.forbidden) if(html['/reviews'].includes(String(r.review_code))) fail('PREPARER_CROSS_SCOPE_ROW_RENDERED');
            for(const p of ['/evidence','/outbox','/reconciliation','/runtime']) if(!html[p].includes('EMPTY')) fail(`PREPARER_EXPECTED_EMPTY_NOT_RENDERED:${p}`);
            console.log(`PREPARER_A_AUTHENTICATED_PREVIEW_PASS rows=${scope.allowed.length}`);
          }
          async function assertNo(s){
            for(const p of ['/reviews','/evidence','/outbox','/reconciliation','/runtime']){
              const html=await page(p,s.cookie);
              if(!html.includes('EMPTY')) fail(`NOAUTH_EXPECTED_EMPTY_NOT_RENDERED:${p}`);
              if(html.includes('Verified rows returned under the current authenticated RLS scope.')) fail(`NOAUTH_GOVERNED_ROW_RENDERED:${p}`);
            }
            console.log('NO_AUTHORITY_AUTHENTICATED_PREVIEW_PASS rows=0');
          }

          try{
            const P=await persona('PREPARER_A'), N=await persona('NO_AUTHORITY');
            prepActor=P.a.actor_id; noActor=N.a.actor_id; prepProgramme=P.f.expected_programme_code;
            if(P.a.external_identity_subject!==E.PREPARER_ORIGINAL) fail('PREPARER_BASELINE_SUBJECT_MISMATCH');
            if(N.a.external_identity_subject!==E.NOAUTH_ORIGINAL) fail('NOAUTH_BASELINE_SUBJECT_MISMATCH');
            if(await authCount(prepActor)!==1) fail('PREPARER_BASELINE_AUTHORITY_MISMATCH');
            if(await authCount(noActor)!==0) fail('NOAUTH_BASELINE_AUTHORITY_MISMATCH');
            console.log('PRE_MUTATION_SNAPSHOT_PASS');

            const pu=await createUser('PREPARER_A'); prepUid=pu.uid;
            const nu=await createUser('NO_AUTHORITY'); noUid=nu.uid;
            console.log('TEMP_AUTH_USERS_CREATED count=2');
            await rebind(prepActor,prepUid); await rebind(noActor,noUid);
            if(await authCount(prepActor)!==1||await authCount(noActor)!==0) fail('AUTHORITY_CHANGED_AFTER_REBIND');
            console.log('TEMP_ACTOR_REBIND_PASS');
            const ps=await session(pu.email,pu.password), ns=await session(nu.email,nu.password);
            if(ps.uid!==prepUid||ns.uid!==noUid) fail('SESSION_PRINCIPAL_MISMATCH');
            console.log('GENUINE_AUTH_SESSIONS_PASS count=2');
            await assertPrep(ps); await assertNo(ns);
            console.log('REL03_STAGE1_BROWSER_ASSERTIONS_PASS');
          }catch(e){failure=e;console.error(`REL03_E2E_ASSERTION_FAIL:${e.message}`);}finally{
            const ce=[];
            try{if(prepActor) await rebind(prepActor,E.PREPARER_ORIGINAL);}catch{ce.push('PREPARER_RESTORE_FAILED');}
            try{if(noActor) await rebind(noActor,E.NOAUTH_ORIGINAL);}catch{ce.push('NOAUTH_RESTORE_FAILED');}
            try{if(prepUid) await admin.auth.admin.deleteUser(prepUid);}catch{ce.push('PREPARER_DELETE_FAILED');}
            try{if(noUid) await admin.auth.admin.deleteUser(noUid);}catch{ce.push('NOAUTH_DELETE_FAILED');}
            try{
              const P=await persona('PREPARER_A'),N=await persona('NO_AUTHORITY');
              if(P.a.external_identity_subject!==E.PREPARER_ORIGINAL) ce.push('PREPARER_NOT_RESTORED');
              if(N.a.external_identity_subject!==E.NOAUTH_ORIGINAL) ce.push('NOAUTH_NOT_RESTORED');
              if(await authCount(P.a.actor_id)!==1) ce.push('PREPARER_AUTHORITY_CHANGED');
              if(await authCount(N.a.actor_id)!==0) ce.push('NOAUTH_AUTHORITY_CHANGED');
              const {data,error}=await admin.auth.admin.listUsers({page:1,perPage:100});
              if(error) ce.push('RESIDUAL_QUERY_FAILED'); else if(data.users.some(u=>u.user_metadata?.hepe_gate==='HEPE-REL-03D.3G')) ce.push('AUTH_RESIDUAL_PRESENT');
            }catch{ce.push('POST_CLEANUP_VERIFY_FAILED');}
            if(ce.length){console.error('MANDATORY_CLEANUP_FAIL:'+ce.join(','));process.exitCode=2;}else{console.log('MANDATORY_ROLLBACK_PASS');console.log('AUTH_CLEANUP_PASS residual=0');console.log('AUTHORITY_ASSIGNMENTS_UNCHANGED_PASS');}
          }
          if(failure) process.exitCode=process.exitCode||1;
          NODE

      - name: Confirm non-production firewall
        if: always()
        run: echo 'NON-PRODUCTION synthetic E2E only; no Production action, no schema/RLS change, no live connector, no PR merge.'
